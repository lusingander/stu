[package]
name = "stu"
version = "0.7.6"
description = "TUI application for AWS S3 written in Rust using ratatui"
authors = ["Kyosuke Fujimoto <kyoro.f@gmail.com>"]
homepage = "https://lusingander.github.io/stu/"
repository = "https://github.com/lusingander/stu"
readme = "README.md"
license = "MIT"
keywords = ["s3", "aws", "cli", "tui", "terminal"]
categories = ["command-line-utilities"]
edition = "2021"
rust-version = "1.94.1"

exclude = ["/.github", "/img", "/tool", "Makefile", "/docs"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = [
    "image-data",
    "wayland-data-control",
] }
aws-config = "1.13.3"
aws-sdk-s3 = { version = "1.161.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
chardetng = "1.0.0"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
console = "0.16.6"
crossterm = { version = "0.29.0", features = ["event-stream"] }
encoding_rs = "0.8.44"
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
] }
humansize = "2.1.3"
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
indexmap = { version = "2.14.2", features = ["serde"] }
infer = { version = "0.22.0", default-features = false }
itsuki = "0.2.1"
laurier = "0.4.0"
once_cell = "1.21.4"
open = "5.4.5"
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "serde",
    "layout-cache",
    "underline-color",
] }
ratatui-image = { version = "11.1.0", default-features = false, features = [
    "crossterm",
] }
serde = { version = "1.0.229", features = ["derive"] }
smart-default = "0.7.1"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "plist-load",
    "yaml-load",
    "regex-fancy",
] }
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
toml = { version = "1.2.1", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "chrono",
    "tracing-log",
] }
tui-input = { version = "0.15.5", default-features = false, features = [
    "crossterm",
] }
umbra = "0.6.0"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }
tempfile = "3.27.0"
termlens = { version = "0.11.10", default-features = false }
testcontainers = "0.28.0"
tokio = { version = "1.54.1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
