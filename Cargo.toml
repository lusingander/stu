[package]
name = "stu"
version = "0.7.6"
description = "TUI application for AWS S3 written in Rust using ratatui"
authors = ["Kyosuke Fujimoto <kyoro.f@gmail.com>"]
homepage = "https://lusingander.github.io/stu/"
repository = "https://github.com/lusingander/stu"
readme = "README.md"
license = "MIT"
keywords = ["s3", "aws", "cli", "tui", "terminal"]
categories = ["command-line-utilities"]
edition = "2021"
rust-version = "1.94.1"

exclude = ["/.github", "/img", "/tool", "Makefile", "/docs"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = [
    "image-data",
    "wayland-data-control",
] }
aws-config = "1.13.3"
aws-sdk-s3 = { version = "1.161.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = "1.9.4"
chardetng = "1.0.0"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
console = "0.16.6"
crossterm = { version = "0.29.0", features = ["event-stream"] }
encoding_rs = "0.8.44"
futures = "0.3.34"
humansize = "2.1.3"
image = "0.25.10"
indexmap = { version = "2.14.2", features = ["serde"] }
infer = "0.22.0"
itsuki = "0.2.1"
laurier = "0.3.0"
once_cell = "1.21.4"
open = "5.4.5"
ratatui = { version = "0.30.2", features = ["serde"] }
ratatui-image = { version = "11.1.0", default-features = false, features = [
    "crossterm",
    "image-defaults",
] }
serde = { version = "1.0.229", features = ["derive"] }
smart-default = "0.7.1"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
] }
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["chrono"] }
tui-input = "0.15.5"
umbra = "0.6.0"

[dev-dependencies]
rstest = "0.28.0"

[profile.release]
codegen-units = 1
lto = true
